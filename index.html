<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cases | Gondopar</title>

    <link rel="stylesheet" href="style.css">

    <!-- ÍCONES INSTAGRAM E WHATSAPP -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <style>

        /* =========================================
           BOTÕES FLUTUANTES
        ========================================= */

        .social-flutuante {

            position: fixed;

            right: 25px;
            bottom: 25px;

            display: flex;
            flex-direction: column;

            gap: 12px;

            z-index: 99999;
        }


        .social-flutuante a {

            width: 58px;
            height: 58px;

            border-radius: 50%;

            display: flex;

            align-items: center;
            justify-content: center;

            text-decoration: none;

            color: white;

            font-size: 29px;

            box-shadow:
                0 5px 18px rgba(0,0,0,0.25);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }


        .social-flutuante a:hover {

            transform: scale(1.10);

            box-shadow:
                0 8px 25px rgba(0,0,0,0.30);
        }


        .botao-whatsapp {

            background: #25D366;
        }


        .botao-instagram {

            background:
                radial-gradient(
                    circle at 30% 107%,
                    #fdf497 0%,
                    #fdf497 5%,
                    #fd5949 45%,
                    #d6249f 60%,
                    #285AEB 90%
                );
        }


        @media(max-width:800px){

            .social-flutuante {

                right: 15px;
                bottom: 15px;
            }

            .social-flutuante a {

                width: 52px;
                height: 52px;

                font-size: 26px;
            }

        }

    </style>

</head>


<body>


<!-- =========================================
     CABEÇALHO
========================================= -->

<header>

    <div class="marca">

        <img
            src="logo.png"
            alt="Gondopar - Gôndolas e mobiliários especiais"
            class="logo-gondopar"
        >

    </div>

</header>



<!-- =========================================
     CONTEÚDO
========================================= -->

<main>


    <section class="apresentacao">

        <span class="categoria">
            CASES GONDOPAR
        </span>

        <h1>
            Projetos que transformam espaços
        </h1>

        <p>
            Conheça alguns dos projetos desenvolvidos pela Gondopar,
            unindo funcionalidade, organização e soluções personalizadas
            para cada negócio.
        </p>

    </section>



    <!-- =========================================
         GALERIA
    ========================================= -->

    <section class="galeria">


        <div class="foto destaque">

            <img
                src="foto1.png"
                alt="Projeto Gondopar"
                onclick="abrirImagem(0)"
            >

        </div>


        <div class="foto">

            <img
                src="foto2.png"
                alt="Projeto Gondopar"
                onclick="abrirImagem(1)"
            >

        </div>


        <div class="foto">

            <img
                src="foto3.png"
                alt="Projeto Gondopar"
                onclick="abrirImagem(2)"
            >

        </div>


        <div class="foto">

            <img
                src="foto4.png"
                alt="Projeto Gondopar"
                onclick="abrirImagem(3)"
            >

        </div>


        <div class="foto">

            <img
                src="foto5.png"
                alt="Projeto Gondopar"
                onclick="abrirImagem(4)"
            >

        </div>


    </section>


</main>



<!-- =========================================
     VISUALIZAÇÃO DAS FOTOS EM TELA CHEIA
========================================= -->

<div id="modal" class="modal">


    <button
        class="fechar"
        onclick="fecharImagem()"
        aria-label="Fechar"
    >
        ×
    </button>


    <button
        class="anterior"
        onclick="imagemAnterior(event)"
        aria-label="Imagem anterior"
    >
        ‹
    </button>


    <img
        id="imagemModal"
        alt="Projeto Gondopar"
    >


    <button
        class="proxima"
        onclick="proximaImagem(event)"
        aria-label="Próxima imagem"
    >
        ›
    </button>


    <div
        id="contador"
        class="contador"
    >
    </div>


</div>



<!-- =========================================
     BOTÕES FLUTUANTES
========================================= -->

<div class="social-flutuante">


    <!-- INSTAGRAM -->

    <a
        href="https://www.instagram.com/gondopar/"
        target="_blank"
        rel="noopener noreferrer"
        class="botao-instagram"
        title="Instagram Gondopar"
        aria-label="Instagram Gondopar"
    >

        <i class="fa-brands fa-instagram"></i>

    </a>



    <!-- WHATSAPP -->

    <a
        href="https://wa.me/554184899144?text=Olá%21%20Conheci%20a%20Gondopar%20através%20dos%20cases%20e%20gostaria%20de%20mais%20informações."
        target="_blank"
        rel="noopener noreferrer"
        class="botao-whatsapp"
        title="Fale conosco pelo WhatsApp"
        aria-label="WhatsApp Gondopar"
    >

        <i class="fa-brands fa-whatsapp"></i>

    </a>


</div>



<!-- =========================================
     RODAPÉ
========================================= -->

<footer>

    <strong>
        GONDOPAR
    </strong>

    <span>
        Gôndolas e mobílias especiais.
    </span>

</footer>



<!-- =========================================
     JAVASCRIPT DA GALERIA
========================================= -->

<script>


    const imagens = [

        "foto1.png",
        "foto2.png",
        "foto3.png",
        "foto4.png",
        "foto5.png"

    ];


    let imagemAtual = 0;



    function abrirImagem(indice){

        imagemAtual = indice;

        document
            .getElementById("modal")
            .classList.add("ativo");

        atualizarImagem();

        document.body.style.overflow = "hidden";

    }



    function fecharImagem(){

        document
            .getElementById("modal")
            .classList.remove("ativo");

        document.body.style.overflow = "auto";

    }



    function atualizarImagem(){

        document
            .getElementById("imagemModal")
            .src = imagens[imagemAtual];


        document
            .getElementById("contador")
            .innerText =
                (imagemAtual + 1)
                + " / "
                + imagens.length;

    }



    function proximaImagem(event){

        if(event){
            event.stopPropagation();
        }

        imagemAtual++;

        if(imagemAtual >= imagens.length){

            imagemAtual = 0;

        }

        atualizarImagem();

    }



    function imagemAnterior(event){

        if(event){
            event.stopPropagation();
        }

        imagemAtual--;

        if(imagemAtual < 0){

            imagemAtual =
                imagens.length - 1;

        }

        atualizarImagem();

    }



    document
        .getElementById("modal")
        .addEventListener(
            "click",
            function(event){

                if(event.target === this){

                    fecharImagem();

                }

            }
        );



    document.addEventListener(
        "keydown",
        function(event){

            const modalAberto =
                document
                    .getElementById("modal")
                    .classList
                    .contains("ativo");


            if(!modalAberto){
                return;
            }


            if(event.key === "Escape"){

                fecharImagem();

            }


            if(event.key === "ArrowRight"){

                proximaImagem(event);

            }


            if(event.key === "ArrowLeft"){

                imagemAnterior(event);

            }

        }
    );


</script>


</body>

</html>
