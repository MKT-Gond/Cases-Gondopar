<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cases | Gondopar</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="marca">
        <div class="logo">GONDOPAR</div>
        <div class="subtitulo">
            Gondopar | gôndolas e mobílias especiais
        </div>
    </div>
</header>


<main>

    <section class="apresentacao">

        <span class="categoria">CASES GONDOPAR</span>

        <h1>Projetos que transformam espaços</h1>

        <p>
            Conheça alguns dos projetos desenvolvidos pela Gondopar,
            unindo funcionalidade, organização e soluções personalizadas
            para cada negócio.
        </p>

    </section>


    <section class="galeria">

        <!-- FOTO PRINCIPAL -->
        <div class="foto destaque">
            <img
                src="foto1.png"
                alt="Projeto Gondopar"
                onclick="abrirImagem(0)"
            >
        </div>

        <!-- FOTO 2 -->
        <div class="foto">
            <img
                src="foto2.png"
                alt="Projeto Gondopar"
                onclick="abrirImagem(1)"
            >
        </div>

        <!-- FOTO 3 -->
        <div class="foto">
            <img
                src="foto3.png"
                alt="Projeto Gondopar"
                onclick="abrirImagem(2)"
            >
        </div>

        <!-- FOTO 4 -->
        <div class="foto">
            <img
                src="foto4.png"
                alt="Projeto Gondopar"
                onclick="abrirImagem(3)"
            >
        </div>

        <!-- FOTO 5 -->
        <div class="foto">
            <img
                src="foto5.png"
                alt="Projeto Gondopar"
                onclick="abrirImagem(4)"
            >
        </div>

    </section>

</main>


<!-- GALERIA EM TELA CHEIA -->

<div id="modal" class="modal">

    <button
        class="fechar"
        onclick="fecharImagem()"
        aria-label="Fechar"
    >
        ×
    </button>

    <button
        class="anterior"
        onclick="imagemAnterior(event)"
        aria-label="Imagem anterior"
    >
        ‹
    </button>

    <img
        id="imagemModal"
        alt="Projeto Gondopar"
    >

    <button
        class="proxima"
        onclick="proximaImagem(event)"
        aria-label="Próxima imagem"
    >
        ›
    </button>

    <div id="contador" class="contador"></div>

</div>


<footer>

    <strong>GONDOPAR</strong>

    <span>
        Gôndolas e mobílias especiais.
    </span>

</footer>


<script>

const imagens = [
    "foto1.png",
    "foto2.png",
    "foto3.png",
    "foto4.png",
    "foto5.png"
];

let imagemAtual = 0;


/* ABRIR FOTO */

function abrirImagem(indice) {

    imagemAtual = indice;

    document
        .getElementById("modal")
        .classList.add("ativo");

    atualizarImagem();

    document.body.style.overflow = "hidden";
}


/* FECHAR FOTO */

function fecharImagem() {

    document
        .getElementById("modal")
        .classList.remove("ativo");

    document.body.style.overflow = "auto";
}


/* ATUALIZAR FOTO */

function atualizarImagem() {

    document.getElementById("imagemModal").src =
        imagens[imagemAtual];

    document.getElementById("contador").innerText =
        (imagemAtual + 1) + " / " + imagens.length;
}


/* PRÓXIMA FOTO */

function proximaImagem(event) {

    if (event) {
        event.stopPropagation();
    }

    imagemAtual++;

    if (imagemAtual >= imagens.length) {
        imagemAtual = 0;
    }

    atualizarImagem();
}


/* FOTO ANTERIOR */

function imagemAnterior(event) {

    if (event) {
        event.stopPropagation();
    }

    imagemAtual--;

    if (imagemAtual < 0) {
        imagemAtual = imagens.length - 1;
    }

    atualizarImagem();
}


/* FECHAR CLICANDO NO FUNDO */

document
    .getElementById("modal")
    .addEventListener("click", function(event) {

        if (event.target === this) {
            fecharImagem();
        }

    });


/* CONTROLE PELO TECLADO */

document.addEventListener("keydown", function(event) {

    const modalAberto =
        document
            .getElementById("modal")
            .classList.contains("ativo");

    if (!modalAberto) {
        return;
    }

    if (event.key === "Escape") {
        fecharImagem();
    }

    if (event.key === "ArrowRight") {
        proximaImagem(event);
    }

    if (event.key === "ArrowLeft") {
        imagemAnterior(event);
    }

});

</script>

</body>
</html>
